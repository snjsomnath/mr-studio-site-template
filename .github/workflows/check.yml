name: Check the table

on:
  push:
  pull_request:

env:
  # The MR Studio version to check with when the table does not name one. The app writes the
  # version that last changed the table into mrstudio.version, and the check uses that.
  MRSTUDIO_VERSION: "0.47.0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Use the version the table was made with
        run: |
          if [ -s mrstudio.version ]; then echo "MRSTUDIO_VERSION=$(head -n 1 mrstudio.version | tr -d '[:space:]')" >> "$GITHUB_ENV"; fi
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mrstudio
          key: mrstudio-${{ env.MRSTUDIO_VERSION }}
      - name: Install the mrstudio command line
        run: |
          command -v mrstudio >/dev/null || cargo install --locked --git https://github.com/snjsomnath/mr-studio --tag "v${MRSTUDIO_VERSION}" mrs-cli
      - name: Check site.json, the data it names and the scene
        run: mrstudio validate .
